name: C/C++ CMake CI

on: [push, pull_request]

env:  # Conan cache environment variables
  CONAN_SYSREQUIRES_MODE: enabled
  CONAN_USER_HOME: "${{ github.workspace }}/conan-cache"
  CONAN_USER_HOME_SHORT: "${{ github.workspace }}/conan-cache/short"

jobs:
  docker:
    name: Test Docker ${{ matrix.target }} image
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: cpp-docker-ci
            image: cpp_ci_env:latest
            smoke: cmake --version && conan --version && clang-22 --version
          - target: cpp-docker-dev
            image: cpp_dev_env:latest
            smoke: cmake --version && conan --version && clang-22 --version && test "$(whoami)" = dev
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build ${{ matrix.target }} image
        uses: docker/build-push-action@v6
        with:
          context: ./docker
          target: ${{ matrix.target }}
          tags: ${{ matrix.image }}
          load: true
          cache-from: type=gha,scope=typescript-register-docker
          cache-to: type=gha,mode=max,scope=typescript-register-docker

      - name: Smoke test ${{ matrix.target }} image
        shell: bash
        run: docker run --rm ${{ matrix.image }} bash -lc '${{ matrix.smoke }}'

  linux:
    name: ${{ matrix.os }}, ${{ matrix.compiler.name }}, ${{ matrix.buildtype }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false  # 'false' means Don't stop matrix workflows even if some matrix entry fails.
      matrix:
        os: [ubuntu-24.04]
        buildtype: [debug, release]
        compiler: [ {name: 'GCC 14', preset: gcc-14, pkgs: 'gcc-14 g++-14 lib32gcc-14-dev gcc-multilib'},
                    {name: 'GCC 15', preset: gcc-15, pkgs: 'gcc-15 g++-15 lib32gcc-15-dev gcc-multilib'},
                    {name: 'GCC 16', preset: gcc-16, pkgs: 'gcc-16 g++-16 lib32gcc-16-dev gcc-multilib'},
                    {name: 'Clang 20', preset: clang-20, version: '20'},
                    {name: 'Clang 21', preset: clang-21, version: '21'},
                    {name: 'Clang 22', preset: clang-22, version: '22'}
                  ]
    steps:
    - uses: actions/checkout@v4

    - name: Cache
      uses: actions/cache@v4
      env:
        cache-name: cache-conan-modules
      with:
        path: |
          ${{ env.CONAN_USER_HOME }}
          ~/.cache/pip
        key: ${{ runner.os }}-${{ env.BUILD_TYPE }}-${{ hashFiles('CMakeLists.txt') }}-${{ hashFiles('cmake/Conan.cmake') }}

    - name: Install LLVM dependencies
      if: ${{ startsWith(matrix.compiler.name, 'Clang') }}
      run:   |
             sudo apt update
             sudo apt install ninja-build
             sudo apt-get purge --auto-remove llvm python3-lldb-14 llvm-14 # https://github.com/llvm/llvm-project/issues/64182
             wget https://apt.llvm.org/llvm.sh
             sudo chmod -x llvm.sh
             sudo bash llvm.sh ${{ matrix.compiler.version }}
      shell: bash

    - name: Install GCC dependencies
      if: ${{ startsWith(matrix.compiler.name, 'GCC') }}
      run:   |
             sudo add-apt-repository --yes ppa:ubuntu-toolchain-r/test
             sudo apt update
             sudo apt install ninja-build ${{ matrix.compiler.pkgs }}
      shell: bash

    - name: Install python dependencies
      run:   |
             python3 -m pip install --upgrade pip setuptools pipenv conan
             python3 -m pip install conan jsonschema virtualenv ninja
             python3 -m pip install 'git+https://github.com/posborne/cmsis-svd.git#egg=cmsis-svd&subdirectory=python'
      shell: bash

    - name: Install conan
      shell: bash
      run: source ~/.profile

    - name: Configure via CMake
      shell: bash
      run: cmake --preset ${{ matrix.compiler.preset }}-${{ matrix.buildtype }} -DFETCH_CMSIS_SVD_DATA=ON

    - name: Build
      shell: bash
      run:  cmake --build --preset ${{ matrix.compiler.preset }}-${{ matrix.buildtype }}

    - name: Test
      shell: bash
      run: ctest --preset ${{ matrix.compiler.preset }}-${{ matrix.buildtype }}

  windows:
    name: ${{ matrix.os }}, ${{ matrix.buildtype }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false  # 'false' means Don't stop matrix workflows even if some matrix entry fails.
      matrix:
        os: [windows-2022, windows-2019]
        buildtype: [debug]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Install conan
        shell: bash
        run: |
          python3 -m pip install --upgrade pip setuptools conan
          python3 -m pip install conan jsonschema virtualenv ninja
          python3 -m pip install -U -e 'git+https://github.com/posborne/cmsis-svd.git#egg=cmsis-svd&subdirectory=python'

      - name: Configure CMake
        shell: bash
        run: cmake --preset ${{ matrix.os }}-${{ matrix.buildtype }} -DFETCH_CMSIS_SVD_DATA=ON

      - name: Build
        shell: bash
        run:  cmake --build --preset ${{ matrix.os }}-${{ matrix.buildtype }}

      - name: Test
        shell: bash
        run: ctest --preset ${{ matrix.os }}-${{ matrix.buildtype }}

  linux-static_analysis:
    name: Static Analysis, ${{ matrix.os }}, ${{ matrix.compiler.name }}, ${{ matrix.buildtype }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false  # 'false' means Don't stop matrix workflows even if some matrix entry fails.
      matrix:
        os: [ubuntu-24.04]
        buildtype: [debug]
        compiler: [{name: 'Clang 22', preset: clang-22, pkgs: 'clang-22 llvm-22 llvm-22-dev libclang-22-dev', iwyu_branch: 'clang_22', path_prefix: "/usr/lib/llvm-22"}]

    steps:
    - uses: actions/checkout@v4

    - name: Cache
      uses: actions/cache@v4
      env:
        cache-name: cache-conan-modules
      with:
        path: |
          ${{ env.CONAN_USER_HOME }}
          ~/.cache/pip
        key: ${{ runner.os }}-${{ env.BUILD_TYPE }}-${{ hashFiles('CMakeLists.txt') }}-${{ hashFiles('cmake/Conan.cmake') }}

    - name: Install conan
      shell: bash
      run: |
        python3 -m pip install --upgrade pip setuptools
        python3 -m pip install conan jsonschema virtualenv ninja
        python3 -m pip install -U -e 'git+https://github.com/posborne/cmsis-svd.git#egg=cmsis-svd&subdirectory=python'
        source ~/.profile

    - name: Install dependencies
      run:   |
             sudo bash -c "$(wget -O - https://apt.llvm.org/llvm.sh)" 22
             sudo apt update
             sudo apt install ninja-build ${{ matrix.compiler.pkgs }} cppcheck
      shell: bash

    - name: Compile and install IWYU
      run:   |
             mkdir iwyu && cd iwyu
             git clone https://github.com/include-what-you-use/include-what-you-use.git
             cd include-what-you-use
             git checkout ${{ matrix.compiler.iwyu_branch }}
             cd ..
             mkdir build && cd build
             cmake -G "Ninja" -DCMAKE_PREFIX_PATH=${{ matrix.compiler.path_prefix }} ../include-what-you-use
             ninja
             sudo ninja install
      shell: bash

    - name: Configure via CMake
      shell: bash
      run: cmake --preset ${{ matrix.compiler.preset }}-${{ matrix.buildtype }}-static-analysis -DCXX_STANDARD=17 -DFETCH_CMSIS_SVD_DATA=ON

    - name: Build
      shell: bash
      run:  cmake --build --preset ${{ matrix.compiler.preset }}-${{ matrix.buildtype }}-static-analysis

  linux-cross-compiling-armv7:
    name: ARM GCC, ${{ matrix.os }}, ${{ matrix.buildtype }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false  # 'false' means Don't stop matrix workflows even if some matrix entry fails.
      matrix:
        os: [ubuntu-22.04]
        buildtype: [debug, release]

    steps:
    - uses: actions/checkout@v4

    - name: Cache
      uses: actions/cache@v4
      env:
        cache-name: cache-conan-modules
      with:
        path: |
          ${{ env.CONAN_USER_HOME }}
          ~/.cache/pip
        key: ${{ runner.os }}-${{ env.BUILD_TYPE }}-${{ hashFiles('CMakeLists.txt') }}-${{ hashFiles('cmake/Conan.cmake') }}

    - name: Install conan
      shell: bash
      run: |
        python3 -m pip install --upgrade pip setuptools conan
        python3 -m pip install conan jsonschema virtualenv ninja
        python3 -m pip install -U -e 'git+https://github.com/posborne/cmsis-svd.git#egg=cmsis-svd&subdirectory=python'
        source ~/.profile

    - name: Install dependencies
      run:   |
             sudo apt update
             sudo apt install ninja-build wget ccache
      shell: bash

    - name: Install GCC ARM
      run:   |
             wget -O archive.tar.xz "https://developer.arm.com/-/media/Files/downloads/gnu/12.2.rel1/binrel/arm-gnu-toolchain-12.2.rel1-x86_64-arm-none-eabi.tar.xz?rev=7bd049b7a3034e64885fa1a71c12f91d&hash=732D909FA8F68C0E1D0D17D08E057619" && \
             echo 84be93d0f9e96a15addd490b6e237f588c641c8afdf90e7610a628007fc96867 archive.tar.xz > /tmp/archive.sha256 && sha256sum -c /tmp/archive.sha256 && rm /tmp/archive.sha256 && \
             tar xf archive.tar.xz -C /opt
      shell: bash

    - name: Configure via CMake
      shell: bash
      run: cmake --preset gcc-arm-${{ matrix.buildtype }} -DFETCH_CMSIS_SVD_DATA=ON

    - name: Build
      shell: bash
      run:  cmake --build --preset gcc-arm-${{ matrix.buildtype }}
