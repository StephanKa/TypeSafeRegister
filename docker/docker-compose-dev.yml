services:
  ssh:
    security_opt: # options needed for gdb debugging
      - seccomp:unconfined
      - apparmor:unconfined
    cap_add:
      - SYS_PTRACE
    container_name: cpp_dev_env
    image: cpp_dev_env:latest
    environment:
      - TERM=xterm-256color
      - CCACHE_DIR=/home/dev/.cache/ccache
    volumes:
      - ${PWD}/../:/home/dev/workspace
      - ccache:/home/dev/.cache/ccache
    command: /usr/sbin/sshd -D
    user: root
    ports:
      - "2222:22"
    hostname: cpp_docker_env

volumes:
  ccache:
